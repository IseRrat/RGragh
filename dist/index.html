<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f7f0">
  <meta name="description" content="RGragh">
  <title>RGragh</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23dcebcf'/%3E%3Cpath d='M14 33h13m0 0V17m0 16v14m0-14h22M49 33V20m0 13v12' fill='none' stroke='%234b8064' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="rail" aria-label="地图侧栏">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></div>
        <div><strong>RGragh</strong></div>
      </div>
      <nav id="categoryFilters" class="category-filters" aria-label="按研究方向筛选"></nav>
      <div class="rail-foot">
        <span class="storage-dot" aria-hidden="true"></span><span

              id="saveState">正在检查数据库连接…</span>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button id="toggleRail" class="button button-icon rail-toggle" type="button" aria-label="收起侧栏" aria-expanded="true">☰</button>
        <nav class="page-tabs" aria-label="地图页面"><a class="active" aria-current="page" href="./index.html">技术演进</a><a href="./domain.html">领域图</a></nav>
        <div class="top-actions">
          <label class="search-box"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="搜索工作、tag…" aria-label="搜索节点"><kbd>/</kbd></label>
          <a class="library-link" href="./work.html">论文库</a>
          <button id="menuButton" class="button button-icon" type="button" aria-label="数据与备份" aria-expanded="false">⋯</button>
          <div id="dataMenu" class="data-menu" hidden>
            <button id="exportData" type="button">导出 JSON 备份</button>
            <button id="exportLocalBackup" type="button" hidden>导出上一份本地数据</button>
            <button id="importData" type="button">导入 JSON 备份</button>
            <p>本机 MySQL 自动保存。</p>
          </div>
          <input id="importFile" type="file" accept="application/json,.json" hidden>
        </div>
      </header>

      <section id="mapView" class="view map-view" aria-labelledby="mapTitle">
        <div class="view-heading">
          <div><h2 id="mapTitle">技术演进</h2><p>拖动画布平移 · Ctrl＋滚轮缩放</p></div>
          <div class="view-tools"><span id="resultCount" class="result-count"></span><button id="zoomOut" class="zoom" aria-label="缩小" type="button">−</button><span id="zoomLabel" class="zoom-label">100%</span><button id="zoomIn" class="zoom" aria-label="放大" type="button">＋</button><button id="zoomFit" class="fit" type="button">适合宽度</button></div>
        </div>
        <div id="mapViewport" class="map-viewport" tabindex="0" aria-label="可滚动的技术演进树">
          <div id="mapStage" class="map-stage"><div id="mapInner" class="map-inner"></div></div>
        </div>
      </section>

    </main>

  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="nodeTooltip" class="node-tooltip" role="tooltip" hidden><span>介绍</span><p id="nodeTooltipText"></p></div>
  <div id="nodeContextMenu" class="node-context-menu" role="menu" aria-label="节点操作" hidden></div>
  <dialog id="nodeDialog" class="node-dialog" aria-label="编辑节点"></dialog>
  <dialog id="tagDialog" class="tag-dialog" aria-label="选择或编辑标签"></dialog>
  <dialog id="tagConfirmDialog" class="confirm-dialog" aria-labelledby="tagConfirmTitle">
    <h3 id="tagConfirmTitle">确认更换 tag</h3><p id="tagConfirmMessage"></p>
    <div class="dialog-actions"><button type="button" class="button button-ghost" data-tag-confirm="cancel">取消</button><button type="button" class="button button-primary" data-tag-confirm="apply">确认更换</button></div>
  </dialog>
  <dialog id="deleteDialog" class="confirm-dialog" aria-labelledby="deleteTitle">
    <h3 id="deleteTitle">删除节点</h3><p id="deleteMessage"></p>
    <div class="dialog-actions"><button type="button" class="button button-ghost" data-delete="cancel">取消</button><button type="button" class="button button-ghost" data-delete="promote">保留子节点</button><button type="button" class="button button-danger" data-delete="cascade">连同子节点删除</button></div>
  </dialog>
  <script type="module" src="./app.js"></script>
</body>
</html>
