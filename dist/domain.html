<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f4f7f0"><title>领域图 · RGragh</title><link rel="stylesheet" href="./domain.css"></head>
<body>
  <header class="topbar"><a class="brand" href="./index.html">RGragh</a><nav class="page-tabs" aria-label="地图页面"><a href="./index.html">技术演进</a><a class="active" aria-current="page" href="./domain.html">领域图</a></nav><a class="library-link" href="./work.html">论文库</a></header>
  <main><div class="heading"><div><h1>领域图</h1><p>按主要优化对象组织方向 · 点击节点编辑 · 拖动画布平移 · Ctrl＋滚轮缩放</p></div><div class="tools"><span id="saveState">正在读取 MySQL…</span><button id="zoomOut" aria-label="缩小">−</button><span id="zoomLabel">100%</span><button id="zoomIn" aria-label="放大">＋</button><button id="zoomFit">适合窗口</button></div></div><div id="viewport" class="viewport"><div id="stage"><div id="canvas"></div></div></div></main>
  <dialog id="editor"><form method="dialog"><div class="dialog-head"><div><small id="editorLevel"></small><h2 id="editorTitle">编辑方向</h2></div><button class="close" value="cancel" aria-label="关闭">×</button></div><label>中文名称<input id="nameInput" maxlength="60" required></label><label>英文术语<input id="englishInput" maxlength="100" placeholder="English term"></label><label>颜色<input id="colorInput" type="color"></label><p id="colorHint" class="hint">同一一级方向下的二级方向共用颜色。</p><div class="dialog-actions"><button id="deleteButton" type="button" class="danger">删除</button><span></span><button value="cancel">取消</button><button id="saveButton" type="button" class="primary">保存</button></div></form></dialog>
  <dialog id="confirm"><div class="dialog-head"><h2>确认删除</h2></div><p id="confirmText"></p><div class="dialog-actions"><button id="cancelDelete" type="button">取消</button><button id="confirmDelete" type="button" class="danger">确认删除</button></div></dialog>
  <div id="toast" role="status" aria-live="polite"></div><script type="module" src="./domain.js"></script>
</body></html>
